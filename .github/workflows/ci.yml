name: Front-end CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Validate production scripts
        run: bash -n deploy/nightly/deploy.sh deploy/nightly/install.sh deploy/monitoring/healthcheck.sh deploy/monitoring/install.sh
      - name: Build and smoke-test production image
        run: |
          docker build -t cep-front:ci .
          docker run --rm -d --name cep-front-ci --read-only --tmpfs /tmp --tmpfs /var/cache/nginx --tmpfs /var/run -p 127.0.0.1:18080:8080 cep-front:ci
          trap 'docker rm -f cep-front-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/healthz
          curl --fail --silent http://127.0.0.1:18080/ | grep -q '<div id="root"></div>'

  desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: dotnet build desktop/CepHoras.Desktop -c Debug
      - run: dotnet build desktop/CepHoras.Desktop -c Release
